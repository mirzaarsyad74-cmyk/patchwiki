name: Discord Auto-Sync to Tutorial

on:
  schedule:
    # Runs every 1 hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: 'Force overwrite and re-download all guides'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  sync-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scrape Discord Channel
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: '1498980524297818142'
          DISCORD_GUILD_ID: '333191744873299978'
          OVERWRITE_ALL: 'true'
        run: node scripts/sync-discord.js

      - name: Split Upload and Commit Changes
        id: git_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          # Commit data directory first
          git add data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync state update [skip ci]" || true
            git push origin main || true
          fi

          # Batch commit and split-push all files in tutorials/ in safe chunks (<35MB per commit)
          python3 -c "
          import subprocess, os

          def get_pending_files():
              res = subprocess.run(['git', 'status', '--porcelain', 'tutorials'], capture_output=True, text=True)
              files = []
              for line in res.stdout.splitlines():
                  if len(line) > 3:
                      fpath = line[3:].strip().strip('\"')
                      if os.path.exists(fpath):
                          files.append(fpath)
              return files

          pending = get_pending_files()
          print(f'Pending files to commit & push: {len(pending)}')
          MAX_CHUNK_BYTES = 35 * 1024 * 1024
          batch = []
          batch_size = 0
          batch_idx = 1

          for f in pending:
              sz = os.path.getsize(f)
              batch.append(f)
              batch_size += sz
              if batch_size >= MAX_CHUNK_BYTES or len(batch) >= 20:
                  subprocess.run(['git', 'add'] + batch, check=True)
                  msg = f'Import tutorials batch #{batch_idx} ({len(batch)} files) [skip ci]'
                  subprocess.run(['git', 'commit', '-m', msg], check=True)
                  for attempt in range(3):
                      push_res = subprocess.run(['git', 'push', 'origin', 'main'])
                      if push_res.returncode == 0:
                          break
                  batch = []
                  batch_size = 0
                  batch_idx += 1

          if batch:
              subprocess.run(['git', 'add'] + batch, check=True)
              msg = f'Import tutorials batch #{batch_idx} ({len(batch)} files) [skip ci]'
              subprocess.run(['git', 'commit', '-m', msg], check=True)
              for attempt in range(3):
                  push_res = subprocess.run(['git', 'push', 'origin', 'main'])
                  if push_res.returncode == 0:
                      break
          "

      - name: Build static site
        run: node scripts/build.js

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
